---
description: One MIMU packet for the averaging algorithm - validity flag, first-sample time, and the packet's samples. Maps to InputPacket_c in the averageMimuData C shim. The C-compatible representation carries the alignment padding before Meas_Time.
fields:
  - name: Is_Valid
    description: Packet validity flag. True marks a filled packet slot, and packets marked False are skipped by the algorithm.
    type: Boolean
    format: E8
  - name: Meas_Time
    description: "[ns] First-sample time of the packet."
    type: Interfaces.Unsigned_64
    format: U64
  - name: Samples
    description: The packet's pre-converted samples.
    type: Mimu_Sample_X10.T
