---
description: The algorithm tick a guidance stage runs on and the attitude reference it starts from. The component that chains the guidance stages hands this to a stage and receives the stage's reference back.
fields:
  - name: Current_Tick
    type: Tick.T
    description: The tick as scheduled, which the stage uses as the stale reference for its data dependencies.
  - name: Call_Time
    type: Interfaces.Unsigned_64
    format: U64
    description: "[ns] The time the stage propagates to, in nanoseconds of the tick time, as the algorithm tick carries it."
  - name: Reference
    type: Att_Ref.T
    description: The attitude reference the stage starts from.
