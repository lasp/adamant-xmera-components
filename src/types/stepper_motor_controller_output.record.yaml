---
#  /*! @brief Type of command produced by the stepper motor controller */
#  typedef enum StepperMotorCommandType { NONE = 0, STOP, MOVE } StepperMotorCommandType;
#
#  /*! @brief Output from the stepper motor controller algorithm */
#  typedef struct StepperMotorControllerOutput {
#      StepperMotorCommandType commandType; /*!< Type of command to issue */
#      int32_t stepsToMove;                 /*!< [steps] Number of steps to move (only valid for MOVE command) */
#  } StepperMotorControllerOutput;
description: Output from the stepper motor controller algorithm. Maps to StepperMotorControllerOutput in the C shim.
fields:
  - name: Command_Type
    description: Type of command to issue. Values match the C StepperMotorCommandType enumeration (NONE = 0, STOP = 1, MOVE = 2), carried as a 32-bit integer matching the C enum representation.
    type: Interfaces.Integer_32
    format: I32
  - name: Steps_To_Move
    description: "[steps] Number of steps to move. Only valid for the MOVE command. Positive is clockwise, negative is counter-clockwise."
    type: Interfaces.Integer_32
    format: I32
