---
description: Enumerations for the Solar Array Reference component.
enums:
  - name: Tracking_Mode
    description: Solar array reference tracking mode. Values match the C TrackingMode enumeration.
    literals:
      - name: Auto_Track
        value: 0
        description: The reference angle turns the array surface normal toward the sun.
      - name: Specified_Angle
        value: 1
        description: The reference angle is the specified array angle.
  - name: Commanded_Tracking_Mode
    description: This is the tracking mode of the solar arrays as reported by the commanding component. It adds Disabled to the modes of the algorithm, for the states that do not control the solar arrays. The command to the solar array reference component carries Tracking_Mode instead, since the component is only commanded while the arrays are controlled.
    literals:
      - name: Disabled
        value: 0
        description: The solar arrays are not controlled. The component must not be ticked in this mode.
      - name: Auto_Track
        value: 1
        description: The reference angle turns the array surface normal toward the sun.
      - name: Specified_Angle
        value: 2
        description: The reference angle is the specified array angle.
