---
#  typedef struct {
#      double timeTag;                           /*!< [s] time tag of the CSS reading */
#      double cosValues[SUNLINE_FILTER_MAX_CSS]; /*!< [-] CSS cosine measurement values */
#  } SunlineCssData_c;
description: Coarse sun sensor reading for the sunline filter. Maps to SunlineCssData_c in the sunlineFilter C shim, which takes it by pointer.
fields:
  - name: Time_Tag
    description: "[s] Measurement time tag. A value greater than zero marks a fresh reading."
    type: Long_Float
    format: F64
  - name: Cos_Values
    description: "[-] Cosine reading of each sensor slot. Only the first configured number of sensors is read."
    type: Packed_F64x8.T
