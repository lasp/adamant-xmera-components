---
description: Inertial 3D algorithm produces a fixed inertial attitude reference message. The algorithm holds the reference attitude as configuration and returns it unchanged on every tick. The attitude is a parameter, and the algorithm validates it before it is applied.
execution: passive
init:
  description: Initializes the inertial 3D algorithm instance with the default parameter value.
connectors:
  - description: Run the algorithm up to the current time and return the attitude reference it produces.
    type: Tick.T
    return_type: Att_Ref.T
    kind: service
  - description: Apply any pending parameter update. Called on GNC state change.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
