---
description: Inertial 3D algorithm produces a fixed inertial attitude reference message. The algorithm holds the reference attitude as configuration and returns it unchanged on every tick. The attitude is supplied as a data dependency, published by the GNC state manager when it commands the inertial-hold state, so it is normally stale and a fresh value reconfigures the algorithm.
execution: passive
init:
  description: Initializes the inertial 3D algorithm instance.
connectors:
  - description: Run the algorithm up to the current time and return the attitude reference it produces.
    type: Tick.T
    return_type: Att_Ref.T
    kind: service
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
