---
description: Inertial 3D algorithm produces a fixed inertial attitude reference message. The algorithm holds the reference attitude as immutable configuration and returns it unchanged on every tick, so it is configured once rather than supplied per tick. It is currently sourced from a component parameter; whether the GNC state manager should instead supply it at the inertial-hold transition is an open design question.
execution: passive
init:
  description: Initializes the inertial 3D algorithm instance.
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: The data product invoker connector.
    type: Data_Product.T
    kind: send
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
