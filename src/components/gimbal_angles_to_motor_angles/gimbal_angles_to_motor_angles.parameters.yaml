---
description: Parameters for the Gimbal Angles To Motor Angles component. The default rhombus and spline coefficients are a fit of an example gimbal-to-motor-steps lookup table.
parameters:
  - name: Steps_Per_Revolution
    description: "[steps] Number of motor steps per 2*pi rad. Must be in [1, 100000]. The default is the value the algorithm's unit tests use, not that of a motor, so the default motor angles span many revolutions."
    type: Packed_U32.T
    default: "(Value => 628)"
  - name: Half_Diagonal_Tip
    description: "[rad] Half of the rhombus diagonal along the gimbal tip axis. This is the largest gimbal tip angle. Must be in (0, pi/2]."
    type: Packed_F32.T
    default: "(Value => 2.839591702E-01)"
  - name: Half_Diagonal_Tilt
    description: "[rad] Half of the rhombus diagonal along the gimbal tilt axis. This is the largest gimbal tilt angle. Must be in (0, pi/2]."
    type: Packed_F32.T
    default: "(Value => 4.324655447E-01)"
  - name: Theta_Max
    description: "[rad] Largest requested thrust cone angle. Must be greater than zero and not greater than the radius of the largest circle in the rhombus."
    type: Packed_F32.T
    default: "(Value => 2.356194490E-01)"
  - name: Motor_1_Coefficients_Row_0
