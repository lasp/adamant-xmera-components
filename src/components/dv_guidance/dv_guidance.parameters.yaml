---
description: Parameters for the Dv Guidance component. Together they define the burn frame, so they are set when a burn is commanded. The defaults form a valid frame and stand in until then.
parameters:
  - name: Cmd_Dv_N
    description: "[m/s] Commanded delta-V in inertial frame components. The third axis of the burn frame points along it. Must be finite and at least 1.0E-6 m/s long."
    type: Packed_F32x3.T
    default: "[0.0, 0.0, 1.0]"
  - name: R_Hat_Pref_N
    description: "[-] Preferred direction of the second axis of the burn frame in inertial frame components. Must be finite, within 1.0E-3 of unit length, and not within about 0.06 degrees of parallel or antiparallel to the commanded delta-V. Only its component perpendicular to the delta-V shapes the frame."
    type: Packed_F32x3.T
    default: "[1.0, 0.0, 0.0]"
