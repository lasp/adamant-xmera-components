---
description: This is a unit test suite for the Dv Guidance component
tests:
  - name: Test
    description: Check the reference returned for the burn frame of the algorithm's Python reference test, with zero reference rates, to ensure the Ada to C to C++ integration is sound, and that the stand-in frame serves before a burn frame is set.
  - name: Test_Burn_Frame_Update
    description: Ensure a newly set delta-V and preferred direction reach the reference on the next tick.
  - name: Test_Invalid_Parameter
    description: Ensure a staged burn frame the algorithm would reject is refused at validation and leaves the reference unchanged.
