---
description: Data dependencies for the Sun Avoidance component.
data_dependencies:
  - name: Spacecraft_Attitude
    type: Nav_Att_Output.T
    description: Spacecraft attitude estimate. Only the MRP attitude of the body relative to inertial is used.
  - name: Input_Attitude_Reference
    type: Att_Ref.T
    description: The attitude reference to slew toward. Its rate and acceleration pass through to the output.
  - name: Spacecraft_State
    type: Cartesian_State.T
    description: "[m, m/s] Spacecraft inertial position and velocity. Only the position is used."
  - name: Sun_State
    type: Cartesian_State.T
    description: "[m, m/s] Sun inertial position and velocity. Only the position is used. An all-zero position means no Sun information, and the input reference then passes through unchanged."
