---
description: Data dependencies for the Sun Avoidance component.
data_dependencies:
  - name: Spacecraft_Attitude
    type: Nav_Att_Output.T
    description: Spacecraft attitude estimate. Only the MRP attitude of the body relative to inertial is used.
  - name: Input_Attitude_Reference
    type: Att_Ref.T
    description: The attitude reference to slew toward. Its rate and acceleration pass through to the output.
  - name: Sun_Direction
    type: Packed_F32x3.T
    description: "[-] Sun direction in the body frame, a unit vector, the predicted sunline from the ephemerides. An all-zero vector means no Sun information, and the input reference then passes through unchanged."
