---
description: Sun avoidance attitude guidance. Superimposes a constant rate slew from the current body attitude onto the input attitude reference, taking the long way around when the short slew would sweep a sensitive body axis across the Sun. The slew is planned on the first tick after a reset and fed forward at the configured rate until the reference is reached. Wraps the SunAvoidanceAlgorithm C++ algorithm via its C shim.
execution: passive
init:
  description: Initializes the sun avoidance algorithm with the default parameter values.
connectors:
  - description: Adjust the attitude reference in the argument away from the sun, at the tick in the argument, and return the result.
    type: Att_Ref_Tick.T
    return_type: Att_Ref.T
    kind: service
  - description: Discard the planned slew so the next tick plans a new one from the current geometry. Must be called on any transition into the guidance mode that uses this component.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
