---
description: Data dependencies for the Sunline Ephem component.
data_dependencies:
  - name: Sun_Ephemeris
    type: Cartesian_State.T
    description: Sun Cartesian state (position and velocity). Only position is used by the algorithm.
  - name: Spacecraft_Position
    type: Cartesian_State.T
    description: Spacecraft Cartesian state (position and velocity)
  - name: Spacecraft_Attitude
    type: Nav_Att_Output.T
    description: Spacecraft attitude estimate (only sigma_BN is used by the algorithm)
