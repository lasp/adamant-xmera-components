---
description: MRP rotation attitude guidance. Superimposes a constant rate rotation on an input attitude reference frame, advancing the rotation by one control period each tick, and returns the resulting reference attitude, rate, and acceleration. Wraps the MrpRotationAlgorithm C++ algorithm via its C shim.
execution: passive
init:
  description: Initializes the MRP rotation algorithm with the control period and the default parameter values.
  parameters:
    - name: Control_Period
      type: Basic_Types.Positive_Short_Float
      description: "[s] Time between two algorithm updates. The rotation advances by this much per tick, so it must equal the rate at which the component is scheduled. Fixed by the assembly, so it is not a runtime parameter. The type keeps it greater than zero."
connectors:
  - description: Rotate the attitude reference in the argument by the configured rotation, advanced to the tick in the argument, and return the result.
    type: Att_Ref_Tick.T
    return_type: Att_Ref.T
    kind: service
  - description: Restart the rotation from the configured initial attitude. Called on GNC state change so the rotation does not carry over from the previous state.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
