---
description: This is a unit test suite for the Mrp Rotation component
tests:
  - name: Test
    description: Run the algorithm through the rotation of the Python reference test, with expected values from its reference model, to ensure the Ada to C to C++ integration is sound.
  - name: Test_Invalid_Parameter
    description: Ensure a staged configuration the algorithm would reject is refused at validation.
  - name: Test_Reset_Applies_Pending_Parameters
    description: Ensure a reset applies a pending configuration update, so the rotation restarts at identity with the new pointing offset.
  - name: Test_Spin_Axis_And_Rate
    description: Ensure the spin is the signed rate about the spin axis by checking that a reversed axis with a negated rate gives the reference rotation.
