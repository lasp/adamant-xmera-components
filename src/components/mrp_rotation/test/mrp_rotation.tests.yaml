---
description: This is a unit test suite for the Mrp Rotation component
tests:
  - name: Test
    description: Run the algorithm through a rotation, pointing offset change, and reset sequence built from the cases of the Python reference test, with expected values from its reference model, to ensure the Ada to C to C++ integration is sound.
  - name: Test_Invalid_Parameter
    description: Ensure a staged configuration the algorithm would reject is refused at validation.
  - name: Test_Reset_Applies_Pending_Parameters
    description: Ensure a reset applies a configuration that was updated but not yet ticked, so the rotation restarts at identity with the new pointing offset.
