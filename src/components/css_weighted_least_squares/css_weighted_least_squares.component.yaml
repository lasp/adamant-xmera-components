---
description: Coarse sun sensor weighted least squares estimator. Fits a unit sun heading in the body frame to the cosine readings of the coarse sun sensor constellation and differences successive headings into a body rate. Wraps the CssWeightedLeastSquaresAlgorithm C++ algorithm via its C shim.
execution: passive
init:
  description: Initializes the estimator with the control period and the default parameter values.
  parameters:
    - name: Control_Period
      type: Basic_Types.Positive_Short_Float
      description: "[s] Time between two algorithm updates. The body rate is the change in heading over this much time, so it must equal the rate at which the component is scheduled. Fixed by the assembly, so it is not a runtime parameter. The type keeps it greater than zero."
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: Discard the prior heading so no rate is produced until two headings have been observed again. Called on GNC state change so a heading from the previous state is not differenced into a rate.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The data product invoker connector
    type: Data_Product.T
    kind: send
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
