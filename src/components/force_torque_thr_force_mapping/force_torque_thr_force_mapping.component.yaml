---
description: Force torque thruster force mapping converts a commanded body force and torque into per-thruster force commands using the truncated-SVD pseudo-inverse of the thruster control mapping matrix.
execution: passive
init:
  description: Initializes the force torque thruster force mapping algorithm.
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The data product invoker connector
    type: Data_Product.T
    kind: send
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
