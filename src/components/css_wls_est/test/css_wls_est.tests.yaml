---
description: This is a unit test suite for the Css Wls Est component.
tests:
  - name: Test_Nominal_Full_Coverage
    description: Along each body axis the constellation is symmetric, so the fit returns the true heading exactly and every residual is zero. The weighted and unweighted fits must agree.
  - name: Test_Two_Sensor_Coverage
    description: With only two lit sensors the fit is the exactly determined minimum norm solution, which bisects the two boresights.
  - name: Test_Single_Sensor_Coverage
    description: With one lit sensor the fit can only report that sensor's boresight, a guess on the cone of possibilities.
  - name: Test_No_Signal
    description: With no reading above the threshold the component reports a zero heading rather than a stale or invented one.
  - name: Test_Rate_Estimate
    description: The first heading yields no rate. A ninety degree step over one tick period yields the corresponding rate about the orthogonal axis.
  - name: Test_Parameter_Update_Reconfigures
    description: Raising the sensor use threshold from the ground drops the active sensor count, and the reconfiguration discards the prior heading so no rate is differenced across it.
  - name: Test_Invalid_Parameter
    description: A non-unit boresight, a negative bias and an out of range threshold are each rejected before they can reach the throwing configuration entry points.
