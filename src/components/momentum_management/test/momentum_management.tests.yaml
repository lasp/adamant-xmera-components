---
description: This is a unit test suite for the Momentum Management component
tests:
  - name: Test
    description: Run the algorithm through the integral accumulation and reset sequence to ensure the Ada to C to C++ integration is sound.
  - name: Test_Dumping_Variants
    description: Check the threshold, the dumpable projection, the desired momentum, and the wheel availability options against the Python reference model.
  - name: Test_Parameter_Update
    description: Ensure a parameter update takes effect on the next tick and keeps the integral state.
  - name: Test_Invalid_Parameter
    description: Ensure a staged configuration the algorithm would reject is refused at validation.
  - name: Test_Invalid_Data_Dependency
    description: Ensure a data dependency with the wrong identifier is treated as a wiring defect and fails the tick's assertion.
