---
description: Solar array reference angle guidance. Computes the array rotation angle that turns the array surface normal toward the sun in the reference attitude, or holds a commanded angle, and publishes it for the array drive controller. The tracking mode and the angles are commanded through data products. Wraps the SolarArrayReferenceAlgorithm C++ algorithm via its C shim.
execution: passive
init:
  description: Initializes the solar array reference algorithm with the default parameter values, sun tracking, and zero angles. The commanded mode and angles take effect on the first tick.
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: Zero the reference angle the algorithm retains from the previous tick, which is its fallback when the sun is aligned with the drive axis. The configuration is untouched.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The data product invoker connector
    type: Data_Product.T
    kind: send
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
