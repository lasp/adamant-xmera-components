---
description: Data products for the Body Rate Miscompare component.
data_products:
  - name: Body_Rate
    type: Packed_F32x3.T
    description: Selected body rate output omega_BN_B (star tracker rate if rates agree, IMU rate if they disagree)
  - name: Rate_Fault_Status
    type: Body_Rate_Fault.T
    description: Body rate fault detection status
  - name: Fault_Latch_Time
    type: Sys_Time.T
    description: Time at which the body rate fault flag most recently set. Published once on the transition into the fault state.
