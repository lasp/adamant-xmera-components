---
description: This is a unit test suite for the Body Rate Miscompare component
tests:
  - name: Test
    description: Run algorithm to ensure integration is sound.
  - name: Test_Use_Imu_Rates_Command
    description: Verify the Use_Imu_Rates command forces and releases IMU-rate output and reports the new setting.
  - name: Test_Reset
    description: Verify the reset connector clears the algorithm's fault persistence counter.
  - name: Test_Fault_Latch_Transition
    description: Verify fault flag transitions publish the latch-time data product and latched/cleared events exactly once per transition, for both the miscompare latch and the commanded override.
  - name: Test_Invalid_Command
    description: Verify a malformed command is rejected and reported via the Invalid_Command_Received event.
  - name: Test_Invalid_Parameter
    description: Ensure staged parameter values the algorithm would reject are refused at validation.
