---
description: Data products for the Sun Search Point component.
data_products:
  - name: Attitude_Guidance
    type: Att_Guid.T
    description: "The attitude guidance for the attitude controller: the attitude error (MRPs) of the body frame relative to the reference frame, the body rate error of B relative to R, and the reference frame rate of R relative to N, all in B frame components. The reference frame acceleration is zero, since the search and pointing rates are piecewise constant. Published every tick."
  - name: Sun_Search_Status
    type: Packed_Sun_Search_Status.T
    description: Whether the search sequence acquired the sun. Published every tick, and latches Sun_Not_Found once the sequence elapses without an acquisition until the reset connector re-arms the search.
