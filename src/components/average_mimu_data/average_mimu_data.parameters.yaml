---
description: Parameters for the Average Mimu Data component
parameters:
  - name: Gyro_Time_Delta
    description: "[s] Allowable time difference from latest measurement for the gyro averaging window (valid range [0.0, 2.0])"
    type: Packed_F32.T
    default: "(Value => 0.0)"
  - name: Accel_Time_Delta
    description: "[s] Allowable time difference from latest measurement for the accel averaging window (valid range [0.0, 2.0])"
    type: Packed_F32.T
    default: "(Value => 0.0)"
  - name: Sigma_Cb
    description: "[-] MRP attitude of the platform frame relative to the body frame. The averaged rates and accelerations are rotated through it from the platform frame into the body frame. Must be finite."
    type: Packed_F32x3.T
    default: "[0.0, 0.0, 0.0]"
