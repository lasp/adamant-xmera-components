---
description: |
  Header-less parameter table payload for the OE State Ephem component.
  Received via a Parameters_Memory_Region.T from a Parameter_Table_Forwarder
  (the forwarder strips the Parameter_Table_Header before forwarding).
  Contains all values that configure the algorithm: the central body
  gravitational parameter, the number of valid arcs, and a fixed array of
  Chebyshev orbital-element arcs.
fields:
  - name: Ephemeris_Time
    description: "[s] Ephemeris time (TDB) associated with the vehicle clock time below. Together with Vehicle_Clock_Time this establishes the TDB <-> vehicle-clock correlation passed to the algorithm before each Update."
    type: Long_Float
    format: F64
  - name: Vehicle_Clock_Time
    description: "[s] Vehicle clock time corresponding to Ephemeris_Time above."
    type: Long_Float
    format: F64
  - name: Central_Body_Mu
    description: "[m^3/s^2] Gravitational parameter of the central body."
    type: Long_Float
    format: F64
  - name: Number_Of_Arcs
    description: Number of valid arc entries in Arcs. Must be 0 .. MAX_OE_RECORDS (10).
    type: Packed_U32.T
  - name: Arcs
    description: Fixed array of arc coefficient records. Slots beyond Number_Of_Arcs are ignored by the algorithm.
    type: Oe_Arc_Records.T
