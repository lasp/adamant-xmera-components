---
description: Parameters for the Css Comm component
parameters:
  - name: Num_Sensors
    description: "[-] The number of CSS sensors to process"
    type: Packed_U32.T
    default: "(Value => 0)"
  - name: Max_Sensor_Value
    description: "[-] Scale factor to go from sensor values to cosine"
    type: Packed_F64.T
    default: "(Value => 0.0)"
  - name: Cheby_Count
    description: "[-] Count on the number of Chebyshev polynomials"
    type: Packed_U32.T
    default: "(Value => 0)"
  - name: Cheby_Polynomials
    description: "[-] Chebyshev polynomials to fit output to cosine"
    type: Packed_F64x10.T
    default: "[others => 0.0]"
