---
description: Unit tests for the Css Comm component
tests:
  - name: Test_Zero_Cheby_Is_Identity
    description: With zero Chebyshev coefficients, output equals input/maxSensorValue clamped to [0, 1].
  - name: Test_Stale_Input_Is_Zeroed
    description: When the CSS sensor data dependency is stale, the ADC input is zeroed before the algorithm runs, producing an all-zero output.
  - name: Test_Cheby_Count_Validation
    description: An out-of-range Cheby_Count is rejected by parameter validation before it can reach the C algorithm's setter.
