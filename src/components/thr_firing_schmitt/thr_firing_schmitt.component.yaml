---
description: Thruster firing Schmitt algorithm converts thruster force commands to on-time commands using Schmitt-trigger (hysteresis) pulse-width modulation.
execution: passive
init:
  description: Initializes the thruster firing Schmitt algorithm with the control period and the default parameter values.
  parameters:
    - name: Control_Period
      type: Basic_Types.Positive_Short_Float
      description: "[s] Time between two algorithm updates. Fixed by the rate at which the assembly schedules the component, so it is not a runtime parameter. The type keeps it greater than zero."
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: Reset the algorithm's Schmitt-trigger hysteresis state. Called on GNC state change.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: Send the computed thruster on-time command directly to the actuation interface component. Only honored by the receiver while the thruster group is in closed-loop control.
    type: Thr_On_Time_Cmd.T
    kind: send
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
