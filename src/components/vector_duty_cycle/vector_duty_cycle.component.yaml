---
description: Duty cycle for a body vector. Passes the input vector through for the first on periods of every cycle and outputs zero for the remaining off periods. In the desaturation state it sits between momentum management and the thruster force mapping, so the thrusters fire in pulses with quiet windows in which the reaction wheels re-stabilize the attitude. The cadence is free-running and advances every tick. Wraps the VectorDutyCycleAlgorithm C++ algorithm via its C shim.
execution: passive
init:
  description: Initializes the duty cycle with the default parameter values.
connectors:
  - description: Apply one control period of the duty cycle to the commanded torque.
    type: Tick.T
    kind: recv_sync
  - description: Restart the duty cycle at the beginning of its on window. The assembly fires this on a state change.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The data product invoker connector
    type: Data_Product.T
    kind: send
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
