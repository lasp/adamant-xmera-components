---
description: This is a unit test suite for the Axis To Gimbal Angles component
tests:
  - name: Test
    description: Recover known gimbal angle pairs from requests built from them, as in the Python reference test, to ensure the Ada to C to C++ integration is sound.
  - name: Test_Deflection_Limit
    description: Check that a request beyond the travel is pulled back onto the cone of the largest deflection, and that a request with no direction leaves the gimbal at neutral.
  - name: Test_Invalid_Parameter
    description: Ensure a staged configuration the algorithm would reject is refused at validation.
  - name: Test_Invalid_Data_Dependency
    description: Ensure a data dependency with the wrong identifier is treated as a wiring defect and fails the tick's assertion.
