---
description: MRP feedback attitude control law with integral feedback and reaction wheel momentum compensation. Computes the commanded body torque from the attitude and rate tracking errors, the reference motion, and the reaction wheel speeds. Wraps the MrpFeedbackAlgorithm C++ algorithm via its C shim.
execution: passive
init:
  description: Initializes the MRP feedback algorithm with the control period and the default parameter values.
  parameters:
    - name: Control_Period
      type: Basic_Types.Positive_Short_Float
      description: "[s] Time between two algorithm updates. The attitude error integral advances by this much per tick, so it must equal the rate at which the component is scheduled. Fixed by the assembly, so it is not a runtime parameter. The type keeps it greater than zero."
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: Zero the integral of the attitude error. Called on GNC state change so the integral does not carry over from the previous state.
    name: Reset_Tick_T_Recv_Sync
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The data product invoker connector
    type: Data_Product.T
    kind: send
  - description: The parameter update connector.
    type: Parameter_Update.T
    kind: modify
