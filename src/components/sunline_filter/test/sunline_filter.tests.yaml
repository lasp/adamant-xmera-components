---
description: This is a unit test suite for the Sunline Filter component
tests:
  - name: Test
    description: Feed the sun sensor cosines and body rate of a slow rotation and check the sun direction, rate, and bias estimates converge to the truth while the covariance shrinks, as in the algorithm's Python reference test, to ensure the Ada to C to C++ integration is sound. The filter state and residual products report the updates and their times.
  - name: Test_Propagation
    description: Ensure products whose timestamps have not advanced are not fed to the filter, so the sun direction is propagated with the seeded rate and the covariance grows under the process noise.
  - name: Test_Reading_Before_Sync
    description: Ensure a product not refreshed since before a reset is not consumed again, products stamped before the tick the filter synchronized its time to are consumed and dropped, and the ones after it are applied.
  - name: Test_Time_Anomalies
    description: Ensure products stamped after the tick are applied at once and not again when the tick reaches them, without shutting out the readings that follow, and products stale by their stamp are still read.
  - name: Test_Sensor_Threshold
    description: Ensure only the sensors reading above the threshold count as active.
  - name: Test_Reset
    description: Ensure the estimate reset re-seeds the state and covariance while the measurements reset keeps them.
  - name: Test_Parameter_Update
    description: Ensure a parameter update reaches the filter while keeping the current estimate.
  - name: Test_Measurement_Delay
    description: Ensure a configured measurement delay holds a reading until the filter time has reached its time tag plus the delay, then applies it.
  - name: Test_Bias_Reset
    description: Ensure a bias estimate that leaves its bounds is reset to its seed value and variance rather than held at the bound.
  - name: Test_Invalid_Parameter
    description: Ensure a staged configuration the algorithm would reject is refused at validation.
  - name: Test_Invalid_Data_Dependency
    description: Ensure a data dependency with the wrong identifier is treated as a wiring defect and fails the tick's assertion.
