---
description: Hill point attitude guidance. Computes the Hill frame attitude reference (attitude, rate, and acceleration of the orbit frame relative to inertial) from the spacecraft and primary body inertial states. Wraps the HillPointAlgorithm C++ algorithm via its C shim.
execution: passive
init:
  description: Initializes the Hill point algorithm.
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The data product invoker connector
    type: Data_Product.T
    kind: send
