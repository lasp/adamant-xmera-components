---
description: Sunline SRuKF state pass-through. Publishes the spacecraft body rate as the sunline state; the remaining state fields have no upstream producer and are zeroed.
execution: passive
init:
  description: Initializes the sunline SRuKF algorithm.
connectors:
  - description: Run the algorithm up to the current time.
    type: Tick.T
    kind: recv_sync
  - description: Fetch a data product item from the database.
    type: Data_Product_Fetch.T
    return_type: Data_Product_Return.T
    kind: request
  - description: The data product invoker connector
    type: Data_Product.T
    kind: send
