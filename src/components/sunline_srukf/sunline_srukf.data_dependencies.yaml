---
description: Data dependencies for the Sunline SRuKF component.
data_dependencies:
  - name: Spacecraft_Attitude
    type: Nav_Att.T
    description: Spacecraft attitude navigation state (sigma_BN, omega_BN_B, vehSunPntBdy, timeTag)
  - name: Css_Sensor_Input
    type: Css_Sensor_Values.T
    description: Coarse sun sensor cosine measurements (pre-converted from ADC by css_comm). The Data field is a 16-element F64 vector; the algorithm currently uses up to MAX_NUM_CSS_SENSORS entries.
