name: Build All Documentation (ARM64)
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  compile_job:
    name: publish_all (arm64)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Starting job triggered by a ${{ github.event_name }} event on a ${{ runner.os }} server hosted by GitHub."
      - run: echo "Checking out ${{ github.repository }} on branch ${{ github.ref }}."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          path: adamant-xmera-components

      - name: Clone adamant repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/adamant
          path: adamant

      - name: Clone fp32-fsw-xmera repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/fp32-fsw-xmera
          path: fp32-fsw-xmera
          # The C shims move in lockstep with the Ada bindings, so CI must
          # build the fp32 revision the bindings were written against rather
          # than the develop tip.
          ref: 26d19cbbc1f00bb2d3cdbfc74e7ce1f1c37ab9d2

      - name: Clone Eigen with freestanding support
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/eigen
          path: eigen
          ref: feature/freestanding

      - name: Build all documentation
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e TMPDIR=/tmp \
            -e ADAMANT_TMP_DIR=/tmp/.adamant \
            ghcr.io/lasp/adamant:0.2 \
            bash adamant-xmera-components/env/github_run.sh "redo adamant-xmera-components/publish"
        # NOTE: TMPDIR and ADAMANT_TMP_DIR must be set to the container's native filesystem (/tmp)
        # rather than the volume-mounted workspace. This prevents cross-device I/O errors with the
        # redo build system's unqlite database and Python's shutil.move() operations.

      - run: echo "Finished with status - ${{ job.status }}."
        if: always()
