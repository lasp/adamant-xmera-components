name: Run All Unit Tests with Coverage (ARM64)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      fp32_ref:
        description: 'fp32-fsw-xmera branch, tag, or commit SHA to test against (defaults to the pin below, then to the repo default branch)'
        required: false
jobs:
  refs:
    uses: ./.github/workflows/_refs.yml
  compile_job:
    name: test_all (arm64)
    needs: refs
    runs-on: ubuntu-latest
    env:
      # === Per-CI-run pin ==========================================
      # Set to a fp32-fsw-xmera branch/tag/SHA to test coupled changes
      # on THIS branch's push/PR runs (adamant-xmera-components and
      # fp32-fsw-xmera are often changed together). workflow_dispatch's
      # fp32_ref input still wins; revert to '' before merging.
      # The C shims move in lockstep with the Ada bindings, so CI must
      # build the fp32 revision the bindings were written against rather
      # than the develop tip.
      FP32_FSW_XMERA_REF_PIN: 'feature/2267-add-accel-to-mimuMajorityVote'
    steps:
      - run: echo "Starting job triggered by a ${{ github.event_name }} event on a ${{ runner.os }} server hosted by GitHub."
      - run: echo "Checking out ${{ github.repository }} on branch ${{ github.ref }}."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          path: adamant-xmera-components

      - name: Clone adamant repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/adamant
          path: adamant
          ref: ${{ needs.refs.outputs.adamant_ref }}

      - name: Clone fp32-fsw-xmera repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/fp32-fsw-xmera
          path: fp32-fsw-xmera
          ref: ${{ needs.refs.outputs.fp32_fsw_xmera_ref }}
      - name: Clone Eigen with freestanding support
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/eigen
          path: eigen
          ref: ${{ needs.refs.outputs.eigen_ref }}

      - name: Run all unit tests and coverage
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e TMPDIR=/tmp \
            -e ADAMANT_TMP_DIR=/tmp/.adamant \
            ${{ needs.refs.outputs.image }} \
            bash adamant-xmera-components/env/github_run.sh "redo adamant-xmera-components/coverage_all"
        # NOTE: TMPDIR and ADAMANT_TMP_DIR must be set to the container's native filesystem (/tmp)
        # rather than the volume-mounted workspace. This prevents cross-device I/O errors with the
        # redo build system's unqlite database and Python's shutil.move() operations.

      - name: Archive logs for failed unit tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_logs_arm64
          path: ${{ github.workspace }}/adamant-xmera-components/build
          if-no-files-found: ignore

      - run: echo "Finished with status - ${{ job.status }}."
        if: always()
