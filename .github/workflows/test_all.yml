name: Run All Unit Tests with Coverage
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fp32_ref:
        description: 'fp32-fsw-xmera branch, tag, or commit SHA to test against (defaults to the pin below, then to the repo default branch)'
        required: false
jobs:
  refs:
    uses: ./.github/workflows/_refs.yml
  compile_job:
    name: test_all
    needs: refs
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.refs.outputs.image }}
      options: --user root
    env:
      # === Per-CI-run pin ==========================================
      # Set to a fp32-fsw-xmera branch/tag/SHA to test coupled changes
      # on THIS branch's push/PR runs (adamant-xmera-components and
      # fp32-fsw-xmera are often changed together). workflow_dispatch's
      # fp32_ref input still wins; revert to '' before merging.
      FP32_FSW_XMERA_REF_PIN: 'feature/2267-add-accel-to-mimuMajorityVote'
    steps:
      - run: echo "Starting job triggered by a ${{ github.event_name }} event on a ${{ runner.os }} server hosted by GitHub."
      - run: echo "Checking out ${{ github.repository }} on branch ${{ github.ref }}."
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          path: adamant-xmera-components
      - name: Check out fp32-fsw-xmera code
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/fp32-fsw-xmera
          path: fp32-fsw-xmera
          ref: ${{ needs.refs.outputs.fp32_fsw_xmera_ref }}
      - name: Clone adamant repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/adamant
          path: adamant
          ref: ${{ needs.refs.outputs.adamant_ref }}
      - name: Clone Eigen with freestanding support
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          repository: lasp/eigen
          path: eigen
          ref: ${{ needs.refs.outputs.eigen_ref }}
      - name: Run all unit tests and coverage
        run: bash adamant-xmera-components/env/github_run.sh "redo adamant-xmera-components/coverage_all"
      - name: Archive logs for failed unit tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_logs
          path: ${{ github.workspace }}/adamant-xmera-components/build
          if-no-files-found: ignore
      - run: echo "Finished with status - ${{ job.status }}."
        if: always()
